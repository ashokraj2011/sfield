format: singularity-flow-configuration-baseline/v1
product:
  version: 0.9.0
  revision: e11faaae05e5d0bc9ee59555719d00957b965ca5
workflow:
  version: 2
  inputsMode: enforce
  harnessImports:
    mode: record
    previewTextBytes: 16384
    totalEnvelopeBytes: 32768
    knowledge:
      enabled: true
      maximumBytes: 8192
    conformance:
      questionPrecedesMutation: warn
      maximumActions: observe
  contextPolicy:
    onApproval: new
    onRejection: keep
    phaseOverrides: {}
  sequenceGates:
    default: soft
    completion: hard
    currentPhase: hard
    freshGeneration: hard
    generationCommit: hard
    remoteGeneration: hard
    publicationPending: hard
  defaultBaseBranch: main
  workItemRoot: singularity/work-items
  idPattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  auto:
    enabled: false
    profile:
      default: story
      allowed:
        - story
    defaultPace: phase
    defaultUntil: first-human-boundary
    workIdAllocator: ulid
    planTtlMinutes: 30
    execution:
      allowedHosts:
        - copilot-cli
      requireManagedWorktree: true
      automaticResume: false
      allowPolicyWaivers: false
      allowClarificationAnswers: false
      allowSequenceOverrides: false
      allowScopeExpansion: false
    repair:
      policy: ask
      maximumAttempts: 1
  adhoc:
    enabled: true
    entry:
      allowExplicitStart: true
      allowUnstartedLanding: true
      defaultMode: in-place
    baseline:
      requireExactRevision: true
      dirtyStart: ask
      upstreamUse: confirm-if-commits-ahead
    localWork:
      allowed: true
    executionUnits:
      allowed: true
      default: null
    scope:
      maximumTouchedResources: 20
      maximumRepositoriesForDirectLanding: 1
    externalEffects:
      mode: governed-device-only
      outsideGovernanceBehavior: promote-or-reconcile
    protectedPaths:
      behavior: promote
    directLanding:
      enabled: true
      maximumRisk: low
      requireIntentConfirmation: true
      requireDispositionCoverage: true
      requireVerification: true
      requireHumanDecision: policy
    promotion:
      triggers:
        repositoriesGreaterThan: 1
        protectedPathTouched: true
        architectureDecisionRequired: true
        externalEffectRequired: true
        estimatedRemainingTasksGreaterThan: 3
        uncertainEffect: true
    executionCeilings:
      activeMinutes: 480
      modelInvocations: 30
      deviceCalls: 100
    discard:
      backup: required
      backupRetentionDays: 14
    telemetry:
      contentFree: true
      individualScoring: false
  git:
    remote: origin
    publish: required
  ledger:
    enabled: false
    branch: state
    remote: origin
    publication: warn
    behind: warn
    enforcement: shadow
    signing: off
    trustTier: T0
    maxRetries: 4
    pinTransport: refs
    retentionDays: 2555
  templatesRoot: singularity/templates
  noModel:
    unknownExternalCommands: warn
  repositoryReadiness:
    requiredBeforeStory: false
    baselinePolicy: choice
    testRuntime:
      nodeOptions: []
    dependencyHydration: when-detected
    build: off
    structuredTests: required-for-code
    applicationStart: off
    receiptScope: git-private-exact-base
  codeDelivery:
    schemaVersion: 2
    mode: enforce
    generationBoundary:
      requireBegin: true
      dirtyStart: block
    changeSet:
      renameDetection: required
      includeCommitted: true
      includeIndex: true
      includeWorktree: true
      includeUntracked: true
      symlinks: reject
    tests:
      requireExecutableSource: true
      minimumDiscovered: 1
      minimumPassed: 1
      executionAssurance: module
      stringCommands: reject
      unknownModelPolicy: block
      requireResultAdapter: true
      requireAffectedModuleCoverage: true
    traceability:
      source: pinned-spec-index
      requireNamespaceQualifiedIds: true
      bareIdCompatibility: unique-only
      sourceBindings: enforce
    publication:
      idempotency: generation-intent
    display:
      source: reference-preview
      previewBytes: 4096
      fullDocumentMaximumBytes: 65536
    model:
      minimumAssurance: unavailable
  planning:
    enabled: true
    promptSource: singularity/prompts/copilot-planning.md
    maxContextBytes: 1048576
  worldModel:
    format: registered-v4
    views:
      - arch.contracts@4
      - biz.rules@4
      - dev.hotspots@4
      - dev.impact@4
    v4:
      composer: deterministic
      consumer: developer
      cachePolicy: reuse-valid
    projections:
      arch.calm:
        enabled: false
        required: false
        contract: arch.calm@1
        calm:
          schemaRelease: "1.2"
          strict: true
        profile:
          includeGovernanceActors: true
          includeControls: true
          includeFlows: true
          includeExternalDependencies: direct-architecture-only
    outputDir: singularity/world-model
    historyDir: singularity/world-model-history
    stateFetchTimeoutMs: 10000
    generation:
      parallel: true
      maxWorkers: 4
    materialization:
      mode: explicit
      publish: governed
      lookahead: none
      depth: phase
      confirmation: prompt
    grounding: warn
    staleness: warn
    injection:
      placeholder: "{{WORLD_MODEL}}"
      mode: append
      maxBytes: 32768
      rules: []
  architectureIntent:
    enabled: false
    allowedPhases:
      - design
      - planning
    blockRequiredUnfulfilledAt:
      - verification
      - release
  ast:
    mode: auto
    fallback: host-and-text
    warmOnStoryStart:
      mode: background
      scope: configured-roots
    evidence:
      mode: replayable
      store: local-directory
    budgets:
      maxFiles: 500
      maxBytes: 20971520
      maxFileBytes: 2097152
  models:
    defaultProvider: copilot-cli
    providers:
      copilot-cli:
        type: copilot-cli
        executable: copilot
        promptTransport: auto
        arguments: []
  tokens:
    mode: exact-or-unavailable
  tokenEconomy:
    enabled: true
    mode: observe
    composer: legacy-v1
    profile: standard
    profiles:
      standard:
        maximumEstimatedPromptTokens: 18000
        reservedOutputTokens: 6000
        maxExpansionTokens: 8000
        observationCapsuleTokens: 3000
        policyOnBudgetBreach: refuse
    observationFirewall: true
    progressiveRetrieval: true
    historicalMemory: false
    cacheStableComposition: true
    providerTelemetry: optional
    ast: optional
  spec:
    mode: record
    coverage: record
    acceptance: presence
    conformanceRows: qualified
    compositionCache: local
    testCommands: {}
    excludes: []
  faultRepair:
    enabled: true
    maxAttempts: 3
    maxMinutes: 20
    maxTokens: 30000
    leaseMinutes: 60
    boundedAuto: false
    environmentCeilings:
      local: guided
      ide: guided
      copilot: guided
      ci: propose
      integration: propose
      staging: propose
      production: diagnose
    protectedPaths:
      - .git
      - singularity
      - infra/production
  documents:
    allowedPhases:
      - intake
      - requirements
      - design
      - implementation-spec
      - reproduction
      - fix-design
      - fix-spec
    maxFileBytes: 26214400
    maxPreviewBytes: 1048576
  collaboration:
    assignmentMode: suggested
    approvalReminderAfterHours: 24
    notifications:
      - terminal
  logging:
    level: info
    console: warn
    maxBytes: 5242880
    keep: 3
  session:
    workItemSelection: prompt
    requireBeforeTools: false
  mcpServers:
    figma:
      label: Figma design context
      hostReference: figma
      agents:
        - product-designer
      phases:
        - design-intake
        - design-inventory
        - component-mapping
        - mobile-spec
        - visual-verification
      tools:
        - get_metadata
        - get_design_context
        - get_screenshot
        - get_variable_defs
        - get_code_connect_map
      required: false
      approval: confirm
      evidence:
        captureToolCalls: true
        captureResults: true
    playwright:
      label: Playwright browser automation
      hostReference: playwright
      agents:
        - qa
        - product-designer
        - poc-automation
        - poc-explorer
        - poc-validator
        - scenario-tester
        - demo-web-tester
      phases:
        - design-intake
        - design-inventory
        - verification
        - testing
        - visual-verification
        - conformance
        - poc-ui-exploration
        - poc-validation
        - scenario-check
        - scenario-retest
        - demo-web-check
        - demo-web-retest
      tools:
        - browser_navigate
        - browser_snapshot
        - browser_click
        - browser_fill_form
        - browser_hover
        - browser_press_key
        - browser_resize
        - browser_take_screenshot
        - browser_console_messages
        - browser_network_requests
      required: false
      approval: confirm
      evidence:
        captureToolCalls: true
        captureResults: true
    demo-playwright:
      label: Demo acceptance browser
      hostReference: playwright
      agents:
        - demo-code-checker
      phases:
        - demo-check
      tools:
        - browser_navigate
        - browser_snapshot
        - browser_click
        - browser_fill_form
        - browser_hover
        - browser_press_key
        - browser_resize
        - browser_take_screenshot
        - browser_console_messages
        - browser_network_requests
      required: false
      approval: confirm
      evidence:
        captureToolCalls: true
        captureResults: true
  approvalSecurity:
    profile: team
    allowSelfApproval: true
    autoEnrollNewIdentities: true
  approvalAuthorities:
    product-approvers:
      label: Product approvers
      allowAnyGitIdentity: false
      members: []
    architecture-reviewers:
      label: Architecture reviewers
      allowAnyGitIdentity: false
      members: []
    engineering-reviewers:
      label: Engineering reviewers
      allowAnyGitIdentity: false
      members: []
    quality-reviewers:
      label: Quality reviewers
      allowAnyGitIdentity: false
      members: []
    design-reviewers:
      label: Design reviewers
      allowAnyGitIdentity: false
      members: []
  artifactSets:
    spec-driven-specification:
      primary: spec.md
      members:
        - path: spec.md
          role: specification
          required: true
        - path: checklists/requirements.md
          role: specification-quality
          required: false
          authority: advisory
    spec-driven-planning:
      primary: plan.md
      members:
        - path: plan.md
          role: implementation-plan
          required: true
        - path: tasks.md
          role: advisory-task-map
          required: false
          authority: advisory
    spec-driven-verification:
      primary: conformance.md
      members:
        - path: conformance.md
          role: conformance
          required: true
        - path: verification/
          role: evidence-collection
          required: true
  workTypes:
    feature:
      label: Feature
      phases:
        - intake
        - requirements
        - design
        - implementation-spec
        - implementation
        - verification
        - conformance
      plannedClaims:
        mode: required
        clausePhases:
          - requirements
          - implementation-spec
        owners:
          implementation: implementation-spec
      templateOverrides:
        intake: feature/intake.md
        requirements: feature/requirements.md
        design: feature/design.md
        implementation-spec: feature/implementation-spec.md
      phaseOverrides:
        requirements:
          inputs:
            - intake
        design:
          inputs:
            - requirements
        implementation-spec:
          inputs:
            - requirements
            - design
        implementation:
          inputs:
            - design
            - implementation-spec
        verification:
          inputs:
            - implementation-spec
            - implementation
        conformance:
          inputs:
            - implementation-spec
            - implementation
            - verification
          approval:
            rejectTo:
              - implementation-spec
              - implementation
              - verification
              - conformance
    bugfix:
      label: Bug fix
      phases:
        - intake
        - reproduction
        - fix-design
        - fix-spec
        - implementation
        - verification
        - conformance
      plannedClaims:
        mode: required
        clausePhases:
          - fix-spec
        owners:
          implementation: fix-spec
      templateOverrides:
        intake: bugfix/intake.md
        reproduction: bugfix/reproduction.md
        fix-design: bugfix/fix-design.md
        fix-spec: bugfix/fix-spec.md
      phaseOverrides:
        reproduction:
          inputs:
            - intake
        fix-design:
          inputs:
            - reproduction
        fix-spec:
          inputs:
            - reproduction
            - fix-design
        implementation:
          inputs:
            - fix-spec
        verification:
          inputs:
            - fix-spec
            - implementation
        conformance:
          inputs:
            - fix-spec
            - implementation
            - verification
          approval:
            rejectTo:
              - fix-spec
              - implementation
              - verification
              - conformance
    chore:
      label: Chore
      phases:
        - intake
        - implementation
        - verification
        - conformance
      templateOverrides:
        intake: chore/intake.md
      phaseOverrides:
        intake:
          artifact:
            kind: requirements
        implementation:
          inputs:
            - intake
          generation:
            task: analyze
        verification:
          inputs:
            - implementation
        conformance:
          inputs:
            - implementation
            - verification
          approval:
            rejectTo:
              - implementation
              - verification
              - conformance
    figma-mobile:
      label: Figma export to mobile app
      phases:
        - design-intake
        - design-inventory
        - component-mapping
        - mobile-spec
        - implementation
        - visual-verification
        - conformance
      plannedClaims:
        mode: required
        clausePhases:
          - mobile-spec
        owners:
          implementation: mobile-spec
      designSources:
        capturePhase: design-intake
        consumeIn:
          - design-inventory
          - component-mapping
          - mobile-spec
          - visual-verification
          - conformance
        staleness: warn
        requireApprovedSet: true
        inventoryDigest: optional
      verification:
        coverage: enforce
        profiles:
          - id: phone-390x844
            label: Phone 390 × 844
            width: 390
            height: 844
            deviceScaleFactor: 1
          - id: tablet-834x1194
            label: Tablet 834 × 1194
            width: 834
            height: 1194
            deviceScaleFactor: 1
        comparison:
          mode: warn
          channelTolerance: 8
          maxDifferingPixelRatio: 0.02
          maxDifferingPixels: null
          maxPixels: 40000000
      documents:
        allowedPhases:
          - design-intake
          - design-inventory
      templateOverrides:
        design-intake: figma-mobile/design-intake.md
        design-inventory: figma-mobile/design-inventory.md
        component-mapping: figma-mobile/component-mapping.md
        mobile-spec: figma-mobile/mobile-spec.md
        implementation: figma-mobile/implementation.md
        visual-verification: figma-mobile/visual-verification.md
        conformance: figma-mobile/conformance.md
      phaseOverrides:
        design-inventory:
          inputs:
            - design-intake
        component-mapping:
          inputs:
            - design-inventory
        mobile-spec:
          inputs:
            - design-inventory
            - component-mapping
        implementation:
          inputs:
            - component-mapping
            - mobile-spec
        visual-verification:
          inputs:
            - design-inventory
            - mobile-spec
            - implementation
        conformance:
          inputs:
            - mobile-spec
            - implementation
            - visual-verification
          approval:
            authorities:
              - design-reviewers
              - architecture-reviewers
              - quality-reviewers
            minimum: 1
            rejectTo:
              - design-inventory
              - component-mapping
              - mobile-spec
              - implementation
              - visual-verification
              - conformance
      sequenceGates:
        documentPhase: hard
    quick-fix:
      label: Quick fix
      phases:
        - intake
        - implement
        - verify
      plannedClaims:
        mode: required
        clausePhases:
          - intake
        owners:
          implement: intake
      templateOverrides:
        intake: quick-fix/intake.md
        implement: quick-fix/implement.md
        verify: quick-fix/verify.md
      phaseOverrides:
        intake:
          label: Scope and plan
          artifact:
            kind: requirements
          clarification:
            mode: when-needed
            maxQuestions: 3
            topics:
              - acceptance criteria
              - changed paths
              - tests
          approval:
            authorities:
              - engineering-reviewers
            minimum: 1
            rejectTo:
              - intake
        implement:
          inputs:
            - intake
        verify:
          inputs:
            - intake
            - implement
    classic-delivery:
      label: Classic delivery
      description: Intake, code, testing, and code checking with committed test
        receipts, the guarded manual REV refinement pilot during Code, and
        explicit reviewer feedback/rework to Code; REV feedback attachments are
        evidence only.
      phases:
        - intake
        - implementation
        - testing
        - conformance
      plannedClaims:
        mode: required
        clausePhases:
          - intake
        owners:
          implementation: intake
      templateOverrides:
        intake: classic-delivery/intake.md
        testing: classic-delivery/testing.md
        conformance: classic-delivery/code-checking.md
      phaseOverrides:
        intake:
          artifact:
            kind: requirements
          clarification:
            mode: required
            maxQuestions: 5
            topics:
              - problem
              - outcome
              - scope
              - acceptance criteria
              - tests
        implementation:
          label: Code
          inputs:
            - intake
          approval:
            authorities:
              - engineering-reviewers
            minimum: 1
            rejectTo:
              - intake
              - implementation
        testing:
          label: Testing
          inputs:
            - intake
            - implementation
          writeScope: artifact-only
          testEvidenceFrom: implementation
          approval:
            authorities:
              - quality-reviewers
            minimum: 1
            rejectTo:
              - implementation
              - testing
        conformance:
          label: Code checking
          inputs:
            - intake
            - implementation
            - testing
          testEvidenceFrom: implementation
          approval:
            authorities:
              - quality-reviewers
              - engineering-reviewers
            minimum: 1
            rejectTo:
              - intake
              - implementation
              - testing
              - conformance
    spec-code-test-loop:
      label: Spec → code → Playwright review
      description: A specification-first Story with Code publication, governed
        Playwright browser observations, and bounded human-directed rework. The
        optional BRL foundation can inspect or plan the exact retained Code
        Candidate, but runs fail closed without its approved runner; MCP or BRL
        observations never replace structured test receipts, Testing,
        publication, or approval.
      phases:
        - specification
        - implementation
        - testing
        - conformance
      reworkLoops:
        - from: testing
          to: implementation
          maxAttempts: 3
          resetOnPhase: specification
      spec:
        mode: enforce
      plannedClaims:
        mode: required
        clausePhases:
          - specification
        owners:
          implementation: specification
      documents:
        allowedPhases:
          - specification
      templateOverrides:
        specification: spec-code-test-loop/specification.md
        testing: spec-code-test-loop/testing.md
        conformance: spec-code-test-loop/conformance.md
      phaseOverrides:
        implementation:
          label: Code
          inputs:
            - specification
          approval:
            authorities:
              - engineering-reviewers
            minimum: 1
            rejectTo:
              - specification
              - implementation
        testing:
          label: Playwright testing review
          inputs:
            - specification
            - implementation
          artifact:
            validation:
              requiredHeadings:
                - Exact inputs and committed test receipt
                - Authorized target and environment
                - Playwright observations
                - Clause results and gaps
                - Correction decision
                - Residual risk
          writeScope: artifact-only
          testEvidenceFrom: implementation
          mcp:
            requiredServers:
              - playwright
            requireSmoke: true
            evidence:
              - server: playwright
                tool: browser_navigate
                minimum: 1
                outputRequired: false
              - server: playwright
                tool: browser_snapshot
                minimum: 1
                outputRequired: true
              - server: playwright
                tool: browser_take_screenshot
                minimum: 1
                outputRequired: true
          approval:
            authorities:
              - quality-reviewers
            minimum: 1
            rejectTo:
              - specification
              - testing
        conformance:
          label: Spec, code and test checking
          inputs:
            - specification
            - implementation
            - testing
          artifact:
            validation:
              requiredHeadings:
                - Exact generation bindings
                - Clause-by-clause comparison
                - Unplanned changes and evidence gaps
                - Correction and final decision
          testEvidenceFrom: implementation
          approval:
            authorities:
              - quality-reviewers
              - architecture-reviewers
            minimum: 1
            rejectTo:
              - specification
              - implementation
              - testing
              - conformance
    document-test-repair:
      label: Document-led acceptance & repair
      description: Turn approved documents or screenshots into scenarios, test
        existing behavior first, repair only demonstrated defects, and retest.
        Completion requires an evidence-backed agent pass and human approval.
        Browser tools are optional; unavailable tests never count as passes.
        After two automatic rework rounds, stop for explicit human direction.
      phases:
        - document-intake
        - scenario-check
        - scenario-repair
        - scenario-retest
      plannedClaims:
        mode: required
        clausePhases:
          - document-intake
        owners:
          scenario-repair: document-intake
      documents:
        allowedPhases:
          - document-intake
      decisions:
        - id: existing-behavior
          after: scenario-check
          kind: branch
          label: Does the existing behavior satisfy every approved scenario?
          enforceConditions: true
          inputs:
            - name: verdict
              label: Agent scenario verdict
              values:
                - pass
                - repair
                - blocked
          routes:
            - id: already-satisfied
              label: Accept existing behavior — no repair
              when:
                verdict: pass
              to: end
              omits:
                - responsibility: implement
                  reason: Fresh scenario evidence demonstrates the approved behavior already
                    exists; no product implementation is needed for this Story.
                  authority: quality-reviewers
            - id: repair-defect
              label: Repair the evidenced defect
              when:
                verdict: repair
              to: scenario-repair
            - id: restore-test-access
              label: Resolve blocked test access and recheck
              to: scenario-check
          maxRounds: 2
        - id: repaired-behavior
          after: scenario-retest
          kind: branch
          label: Do the repaired behavior and fresh tests satisfy every approved scenario?
          enforceConditions: true
          inputs:
            - name: verdict
              label: Agent scenario verdict
              values:
                - pass
                - repair
                - blocked
          routes:
            - id: accepted
              label: Accept the repaired behavior
              when:
                verdict: pass
              to: end
            - id: repair-again
              label: Repair the remaining evidenced defect
              when:
                verdict: repair
              to: scenario-repair
            - id: restore-test-access
              label: Resolve blocked test access and retest
              to: scenario-retest
          maxRounds: 2
    demo-web-e2e-testing:
      label: Demo Web E2E Testing
      description: Compare a web application with approved screenshots and interaction
        scenarios using custom agents and skills. Test existing code first,
        repair demonstrated defects, then retest with fresh evidence. A passing
        agent verdict and human acceptance are both required. Playwright or an
        approved repository E2E runner can be used; two automatic backward
        routes are followed by explicit human direction.
      phases:
        - demo-web-intake
        - demo-web-check
        - demo-web-repair
        - demo-web-retest
      plannedClaims:
        mode: required
        clausePhases:
          - demo-web-intake
        owners:
          demo-web-repair: demo-web-intake
      documents:
        allowedPhases:
          - demo-web-intake
      decisions:
        - id: demo-existing-web-behavior
          after: demo-web-check
          kind: branch
          label: Does the current web application meet the approved screenshot and
            behavior?
          enforceConditions: true
          inputs:
            - name: verdict
              label: Agent web E2E verdict
              values:
                - pass
                - repair
                - blocked
          routes:
            - id: already-satisfied
              label: Accept existing web behavior — no repair
              when:
                verdict: pass
              to: end
              omits:
                - responsibility: implement
                  reason: Fresh web scenario evidence demonstrates the approved screenshot and
                    behavior already match; no product repair is needed.
                  authority: quality-reviewers
            - id: repair-web-defect
              label: Repair the demonstrated web defect
              when:
                verdict: repair
              to: demo-web-repair
            - id: restore-web-access
              label: Restore authorized test access and recheck
              to: demo-web-check
          maxRounds: 2
        - id: demo-repaired-web-behavior
          after: demo-web-retest
          kind: branch
          label: Do fresh web tests and screenshot comparison pass after repair?
          enforceConditions: true
          inputs:
            - name: verdict
              label: Agent web E2E verdict
              values:
                - pass
                - repair
                - blocked
          routes:
            - id: accepted
              label: Accept the tested web repair
              when:
                verdict: pass
              to: end
            - id: repair-web-again
              label: Repair the remaining web defect
              when:
                verdict: repair
              to: demo-web-repair
            - id: restore-web-access
              label: Restore authorized test access and retest
              to: demo-web-retest
          maxRounds: 2
    demo-check-repair-close:
      label: Demo — Check, Repair & Close
      description: Four phases with agent-attached custom skills. Capture screenshots,
        documents and observable scenarios; check existing code first; repair
        demonstrated defects and return to checking; close with a retained
        report only after a fresh pass and human acceptance. Automatic routing
        retains human checkpoints. Three backward routes per decision require
        renewed human direction, never a false pass.
      phases:
        - demo-intake
        - demo-check
        - demo-repair
        - demo-close
      omits:
        - responsibility: implement
          reason: The approved final check proves current code meets the scenarios;
            retained repair history is reported separately and no additional
            implementation is needed to close.
          authority: quality-reviewers
      plannedClaims:
        mode: required
        clausePhases:
          - demo-intake
        owners:
          demo-repair: demo-intake
      documents:
        allowedPhases:
          - demo-intake
      decisions:
        - id: demo-check-result
          after: demo-check
          kind: branch
          label: Does fresh evidence satisfy every approved scenario?
          enforceConditions: true
          inputs:
            - name: verdict
              label: Evidence-backed checker verdict
              values:
                - pass
                - repair
                - blocked
          routes:
            - id: demo-pass-to-close
              label: Accept the checked behavior and prepare closing documents
              when:
                verdict: pass
              to: demo-close
              omits:
                - responsibility: implement
                  reason: Fresh checks demonstrate the current code already meets the approved
                    scenarios, including any retained earlier repairs; no
                    additional implementation is needed on this route.
                  authority: quality-reviewers
            - id: demo-repair-defect
              label: Repair the demonstrated defect
              when:
                verdict: repair
              to: demo-repair
            - id: demo-recheck-access
              label: Resolve unavailable evidence or access and recheck
              to: demo-check
          maxRounds: 3
        - id: demo-repair-handoff
          after: demo-repair
          kind: branch
          label: Retest the repair or return changed scope to intake
          enforceConditions: true
          inputs:
            - name: next
              label: Reviewed repair handoff
              values:
                - recheck
                - revise-intake
          routes:
            - id: demo-retest-repair
              label: Independently check the repaired code
              when:
                next: recheck
              to: demo-check
            - id: demo-revise-intake
              label: Review changed intent or repair scope
              to: demo-intake
          maxRounds: 3
    poc-lite:
      label: POC Lite — local governed change
      description: A model-free four-checkpoint demonstration with repository-native
        validation and one explicit human finish decision; it imposes no MCP,
